services:
  harbordash:
    image: ${HARBORDASH_IMAGE:-ghcr.io/wetterhahn/harbordash:latest}
    restart: unless-stopped
    init: true
    ports:
      - "${DASH_BIND_IP:-0.0.0.0}:${DASH_PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /data
      APP_ORIGIN: ${APP_ORIGIN:-https://start.wetterhahn.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to a non-empty password}
      SESSION_DAYS: ${SESSION_DAYS:-180}
      HOMEBASE_STATUS_TARGETS: ${HOMEBASE_STATUS_TARGETS:-[]}
    volumes:
      - harbordash_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  harbordash_data:
    name: ${DASH_VOLUME_NAME:-harbordash_data}
